<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lector de Data Real Móvil</title>
  <!-- FontAwesome para Iconos -->
  <link rel="stylesheet" href="https://cloudflare.com">
  
  <style>
    /* =========================================================================
       ESTILOS FONDOS Y EFECTO DE VIDRIO (GLASSMORPHISM) JUVENIL Y FULL COMERCIAL
       ========================================================================= */
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, sans-serif; }
    body {
      background: linear-gradient(135deg, #0d0a1b 0%, #120e24 50%, #050308 100%);
      color: #ffffff; min-height: 100vh; display: flex; justify-content: center; align-items: center; padding: 12px;
    }
    .cristal {
      background: rgba(255, 255, 255, 0.03); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
      border: 1px solid rgba(255, 255, 255, 0.07); border-radius: 16px; box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.4);
    }

    /* PANTALLA CRISTALIZADA DE BLOQUEO POR PIN */
    #pantalla-bloqueo {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(4, 2, 8, 0.9);
      backdrop-filter: blur(25px); -webkit-backdrop-filter: blur(25px); z-index: 9999; display: flex; justify-content: center; align-items: center;
    }
    .contenedor-pin { width: 100%; max-width: 300px; padding: 25px; text-align: center; }
    .pantalla-codigo {
      width: 100%; height: 48px; background: rgba(0, 0, 0, 0.5); border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 10px; font-size: 1.6rem; letter-spacing: 6px; text-align: center; color: #fff; margin-bottom: 20px;
    }
    .teclado-numerico { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
    .btn-teclado {
      height: 56px; font-size: 1.3rem; font-weight: bold; color: white; background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.08); border-radius: 50%; cursor: pointer; display: flex; align-items: center; justify-content: center;
      transition: all 0.1s ease;
    }
    .btn-teclado:active { transform: scale(0.9); }

    /* INTERFAZ PRINCIPAL DEL ESCÁNER MÓVIL */
    #interfaz-sistema { width: 100%; max-width: 430px; display: none; flex-direction: column; gap: 15px; }
    header { display: flex; justify-content: space-between; align-items: center; padding: 12px 18px; }
    .titulo-negocio { font-size: 1.2rem; font-weight: 800; color: #fff; }
    .monitores-estado { display: flex; gap: 12px; align-items: center; }
    .indicador-led { display: flex; align-items: center; gap: 6px; font-size: 0.8rem; color: #b3b0cb; }
    .led { width: 10px; height: 10px; border-radius: 50%; background-color: #ff453a; box-shadow: 0 0 6px #ff453a; }
    .led.activo { background-color: #34c759; box-shadow: 0 0 8px #34c759; }

    /* MONITOR FIJO PROFESIONAL COMERCIAL */
    .contenedor-camara-fijo {
      width: 100%; height: 180px; background: #000; border-radius: 16px; overflow: hidden;
      border: 2px solid rgba(99, 102, 241, 0.3); box-shadow: inset 0 0 15px rgba(0,0,0,0.6), 0 0 20px rgba(99, 102, 241, 0.2); position: relative;
    }
    #visor-nativo { width: 100%; height: 100%; display: block; object-fit: cover; background: #000; }

    .panel-confirmacion { padding: 15px; display: flex; flex-direction: column; gap: 10px; text-align: center; }
    .panel-confirmacion h3 { font-size: 1.2rem; color: #ffd60a; }
    .panel-confirmacion p { font-size: 0.9rem; color: #b3b0cb; }

    /* PANEL MULTIPLICADOR NEUMORPHIC INPUT */
    .control-multiplicador { 
      display: grid; grid-template-columns: auto 90px 52px; gap: 10px; align-items: center; padding: 12px 16px;
      box-shadow: inset 1px 1px 3px rgba(255,255,255,0.05), inset -1px -1px 3px rgba(0,0,0,0.4);
    }
    .input-cant { 
      width: 100%; padding: 10px; background: #090614; border: none; border-radius: 10px; color: #fff; 
      text-align: center; font-size: 1.1rem; font-weight: bold; box-shadow: inset 3px 3px 6px rgba(0,0,0,0.7); outline: none;
    }

    /* BOTONES CON EFECTO EXTRUIDO 3D REAL */
    .btn-accion-movil {
      width: 100%; padding: 15px; font-size: 1rem; font-weight: 800; color: #fff; border: none; border-radius: 14px;
      cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 10px; transition: all 0.1s ease;
      text-transform: uppercase; letter-spacing: 0.5px;
    }
    .btn-reiniciar { 
      background: linear-gradient(180deg, #ff554a 0%, #c62828 100%); 
      box-shadow: 0 5px 0 #9e1c1c, 0 8px 15px rgba(255, 69, 58, 0.2);
    }
    .btn-reiniciar:active { transform: translateY(4px); box-shadow: 0 1px 0 #9e1c1c, 0 3px 6px rgba(255, 69, 58, 0.2); }

    #btn-lampara { 
      background: linear-gradient(180deg, #ffd60a 0%, #e6a100 100%); color: #050308; 
      box-shadow: 0 5px 0 #b37e00, 0 8px 15px rgba(255, 214, 10, 0.2); margin-top: 12px;
    }
    #btn-lampara.encendido {
      background: linear-gradient(180deg, #ff453a 0%, #cc241a 100%); color: #fff;
      box-shadow: 0 5px 0 #8c140e, 0 8px 15px rgba(255, 69, 58, 0.2);
    }
    #btn-lampara:active { transform: translateY(4px); box-shadow: 0 1px 0 #b37e00, 0 3px 6px rgba(255, 214, 10, 0.2); }

    .btn-manual { 
      background: linear-gradient(180deg, #6366f1 0%, #3b3fde 100%); margin-top: 12px;
      box-shadow: 0 5px 0 #2b2eab, 0 8px 15px rgba(99, 102, 241, 0.2);
    }
    .btn-manual:active { transform: translateY(4px); box-shadow: 0 1px 0 #2b2eab, 0 3px 6px rgba(99, 102, 241, 0.2); }

    .btn-emergencia-3d {
      height: 42px; width: 100%; border: none; background: linear-gradient(180deg, #ffb703 0%, #d48f00 100%);
      border-radius: 10px; color: #000; font-weight: bold; cursor: pointer; display: flex; align-items: center; 
      justify-content: center; font-size: 1.1rem; box-shadow: 0 4px 0 #8a5d00; transition: all 0.1s ease;
    }
    .btn-emergencia-3d:active { transform: translateY(3px); box-shadow: 0 1px 0 #8a5d00; }
  </style>
</head>
<body>
    
  <!-- PANTALLA DE ACCESO POR PIN -->
  <div id="pantalla-bloqueo">
    <div class="contenedor-pin cristal">
      <h2>LECTOR DE DATA REAL</h2>
      <input type="password" id="campo-pin" class="pantalla-codigo" readonly placeholder="••••••">
      <div class="teclado-numerico">
        <button class="btn-teclado" onclick="añadirDigito('1')">1</button>
        <button class="btn-teclado" onclick="añadirDigito('2')">2</button>
        <button class="btn-teclado" onclick="añadirDigito('3')">3</button>
        <button class="btn-teclado" onclick="añadirDigito('4')">4</button>
        <button class="btn-teclado" onclick="añadirDigito('5')">5</button>
        <button class="btn-teclado" onclick="añadirDigito('6')">6</button>
        <button class="btn-teclado" onclick="añadirDigito('7')">7</button>
        <button class="btn-teclado" onclick="añadirDigito('8')">8</button>
        <button class="btn-teclado" onclick="añadirDigito('9')">9</button>
        <button class="btn-teclado" style="background:rgba(255,69,58,0.12);" onclick="limpiarPin()"><i class="fa-solid fa-eraser"></i></button>
        <button class="btn-teclado" onclick="añadirDigito('0')">0</button>
        <button class="btn-teclado" style="background:rgba(52,199,89,0.12);" onclick="verificarPin()"><i class="fa-solid fa-key"></i></button>
      </div>
    </div>
  </div>

  <!-- INTERFAZ OPERATIVA -->
  <div id="interfaz-sistema">
    <header class="cristal">
      <div class="titulo-negocio"><i class="fa-solid fa-wifi"></i> CANAL ACTIVO</div>
      <div class="monitores-estado">
        <div class="indicador-led"><div id="led-red" class="led activo"></div> API</div>
        <div class="indicador-led"><div id="led-cam" class="led"></div> Lente</div>
      </div>
    </header>

    <div class="contenedor-camara-fijo">
      <video id="visor-nativo" autoplay playsinline></video>
    </div>

    <!-- CONTROLES ALINEADOS SIMÉTRICAMENTE -->
    <div class="control-multiplicador cristal">
      <span><i class="fa-solid fa-layer-group"></i> Multiplicar cantidad:</span>
      <input type="number" id="cant-multiplicador" class="input-cant" value="1" min="1" oninput="clickAuditivoInput()">
      <button class="btn-emergencia-3d" onclick="forzarTasaManualEmergencia()" title="Tasa de Emergencia">
        <i class="fa-solid fa-triangle-exclamation"></i>
      </button>
    </div>

    <div class="panel-confirmacion cristal">
      <h3 id="txt-prod">Buscando códigos...</h3>
      <div id="txt-monto" style="font-size: 1.6rem; font-weight: bold; color: #34c759; margin: 4px 0; text-shadow: 0 0 10px rgba(52,199,89,0.2);">---</div>
      <p id="txt-cod">Muestre la barra al lente trasero</p>
    </div>

    <button class="btn-accion-movil btn-reiniciar" onclick="forzarReinicioLenteNativo()"><i class="fa-solid fa-camera-rotate"></i> Resetear Lente</button>
    
    <button class="btn-accion-movil" id="btn-lampara" onclick="alternarLamparaNativa()">
      <i class="fa-solid fa-lightbulb"></i> Encender Lámpara
    </button>

    <button class="btn-accion-movil btn-manual" onclick="ingresoCodigoManual()"><i class="fa-solid fa-keyboard"></i> Código Manual</button>
  </div>

  <!-- VENTANA FLOTANTE DE REGISTRO RÁPIDO -->
  <div id="modal-registro-rapido" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(4, 2, 8, 0.95); backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px); z-index: 10000; justify-content: center; align-items: center; padding: 20px;">
    <div class="cristal" style="width: 100%; max-width: 360px; padding: 25px; display: flex; flex-direction: column; gap: 15px;">
      <h3 style="color: #ffd60a; text-align: center;"><i class="fa-solid fa-box-open"></i> Producto Nuevo</h3>
      
      El código no existe. Regístralo rápidamente aquí:</p>
      
      <div>
        <label style="font-size: 0.8rem; color: #a5a1ff; display: block; margin-bottom: 4px;">Código de Barras:</label>
        <input type="text" id="reg-codigo" style="width: 100%; padding: 10px; background: rgba(0,0,0,0.4); border: 1px solid rgba(255,255,255,0.15); border-radius: 8px; color: #fff; font-weight: bold;" readonly>
      </div>

      <div>
        <label style="font-size: 0.8rem; color: #a5a1ff; display: block; margin-bottom: 4px;">Nombre del Artículo:</label>
        <input type="text" id="reg-nombre" placeholder="Ej. Harina Pan 1Kg" style="width: 100%; padding: 10px; background: rgba(0,0,0,0.2); border: 1px solid rgba(255,255,255,0.1); border-radius: 8px; color: #fff;">
      </div>

      <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 12px;">
        <div style="display: flex; flex-direction: column;">
          <label style="font-size: 0.8rem; color: #34c759; margin-bottom: 4px;">Precio USD ($)</label>
          <input type="number" id="reg-precio-usd" placeholder="0.00" step="0.01" style="width: 100%; padding: 12px 10px; background: rgba(0,0,0,0.3); border: 2px solid rgba(52,199,89,0.4); border-radius: 10px; color: #fff; font-weight: bold; text-align: center;">
        </div>
        <div style="display: flex; flex-direction: column;">
          <label style="font-size: 0.8rem; color: #ffd60a; margin-bottom: 4px;">Precio Bs (Bs)</label>
          <input type="number" id="reg-precio-bs" placeholder="0.00" step="0.01" style="width: 100%; padding: 12px 10px; background: rgba(0,0,0,0.3); border: 2px solid rgba(255,214,10,0.4); border-radius: 10px; color: #fff; font-weight: bold; text-align: center;">
        </div>
      </div>

      <button class="btn-accion-movil" style="background: linear-gradient(180deg, #34c759 0%, #218838 100%); margin-top: 10px; box-shadow: 0 4px 0 #1e6327;" onclick="ejecutarGuardadoAutomaticoBodega()">
        <i class="fa-solid fa-cloud-arrow-up"></i> Guardar y Vender
      </button>
      
      <button class="btn-accion-movil" style="background: transparent; border: 1px solid rgba(255,255,255,0.2); color: #fff;" onclick="cerrarFormularioRegistro()">
        Cancelar
      </button>
    </div>
  </div>

  <script>
    const URL_APPS_SCRIPT = "https://script.google.com/macros/s/AKfycbzE99YUyPWmusBlsznIau0GMyjIbXATw1FrJLglxR1O8zWEILES-uRHy6dy6Qvt13Djsw/exec";
    let pinIntroducido = "";
    const campoPin = document.getElementById("campo-pin");
    let streamVideoActivo = null;
    let pistaVideoLente = null; 
    let lamparaEncendida = false;
    let detectorDeBarras = null;
    let bucleEscaneoActivo = null;
    let bloqueoUnMilisegundo = false;

    window.tasaCambioSistema = parseFloat(localStorage.getItem("tasaEmergenciaGuardada")) || 45;

    function añadirDigito(num) {
      if (pinIntroducido.length < 6) { 
        pinIntroducido += num; 
        campoPin.value = "•".repeat(pinIntroducido.length); 
        reproducirVoz(num); 
      }
    }

    function limpiarPin() { 
      pinIntroducido = ""; 
      campoPin.value = ""; 
      reproducirVoz("Borrado");
    }

    function verificarPin() {
      if (pinIntroducido === "123456") {
        document.getElementById("pantalla-bloqueo").style.display = "none";
        document.getElementById("interfaz-sistema").style.display = "flex";
        reproducirVoz("Acceso concedido. Lector en línea.");
        mantenerPantallaAlwaysActive();
        encenderCamaraInternaPura();
        solicitarTasaCambioAutomaticaAlInicio();
      } else { 
        reproducirVoz("Código de acceso incorrecto"); 
        limpiarPin(); 
      }
    }

    function reproducirVoz(msg) {
      if ('speechSynthesis' in window) { 
        window.speechSynthesis.cancel(); 
        const u = new SpeechSynthesisUtterance(msg); 
        u.lang = 'es-ES'; 
        window.speechSynthesis.speak(u); 
      }
    }

    window.addEventListener('online', () => { 
      document.getElementById("led-red").classList.add("activo"); 
      reproducirVoz("Aplicación conectada a internet. Canal de ventas activo."); 
      solicitarTasaCambioAutomaticaAlInicio();
    });

    window.addEventListener('offline', () => { 
      document.getElementById("led-red").classList.remove("activo"); 
      reproducirVoz("Aplicación sin conexión a internet. Active el modo de emergencia."); 
    });

    async function mantenerPantallaAlwaysActive() {
      if ('wakeLock' in navigator) { 
        try { await navigator.wakeLock.request('screen'); } catch (e) {} 
      }
    }

    function encenderCamaraInternaPura() {
      document.getElementById("led-cam").classList.remove("activo");
      
      navigator.mediaDevices.getUserMedia({ 
        video: { facingMode: "environment" }, 
        audio: false 
      })
      .then((stream) => {
        streamVideoActivo = stream;
        const tracks = stream.getVideoTracks();
        if (tracks.length > 0) {
          // CORRECCIÓN CRÍTICA: Se asigna la pista individual indexada, no el array completo
          pistaVideoLente = tracks[0]; 
        }
        
        const videoElemento = document.getElementById("visor-nativo");
        videoElemento.srcObject = stream;
        
        document.getElementById("led-cam").classList.add("activo");
        reproducirVoz("Visor de cámara trasera encendido.");
        activarProcesamientoAutomaticoInterno(videoElemento);
      })
      .catch((err) => {
        console.error(err);
        reproducirVoz("Acceso a cámara denegado.");
        alert("POR FAVOR, OTORGUE EL PERMISO DE CÁMARA EN SU NAVEGADOR");
      });
    }

    function activarProcesamientoAutomaticoInterno(elementoVideo) {
      if ('BarcodeDetector' in window) {
        detectorDeBarras = new BarcodeDetector({ formats: ['ean_13', 'ean_8', 'upc_a', 'code_128', 'code_39'] });
        
        bucleEscaneoActivo = setInterval(async () => {
          if (bloqueoUnMilisegundo) return;
          
          try {
            const codigosEncontrados = await detectorDeBarras.detect(elementoVideo);
            if (codigosEncontrados.length > 0) {
              bloqueoUnMilisegundo = true;
              const codigoBarras = codigosEncontrados[0].rawValue; 
              reproducirVoz("Código detectado.");
              dispararTransmisionUrl(codigoBarras);
              
              setTimeout(() => { bloqueoUnMilisegundo = false; }, 3500);
            }
          } catch (e) { }
        }, 300);
      } else {
        document.getElementById("txt-prod").innerText = "Modo manual activo";
        document.getElementById("txt-cod").innerText = "Dispositivo requiere Código Manual.";
        reproducirVoz("Lector automático no compatible con este dispositivo. Use entrada manual.");
      }
    }

    function alternarLamparaNativa() {
      if (!pistaVideoLente) { 
        reproducirVoz("El visor de la cámara está apagado."); 
        return; 
      }
      try {
        const capacidades = pistaVideoLente.getCapabilities();
        if (!capacidades.torch) { 
          reproducirVoz("Lámpara o flash no disponible en este navegador."); 
          alert("Este dispositivo o navegador bloquea el control de la linterna.");
          return; 
        }
        
        lamparaEncendida = !lamparaEncendida;
        pistaVideoLente.applyConstraints({ advanced: [{ torch: lamparaEncendida }] })
        .then(() => {
          const btn = document.getElementById("btn-lampara");
          if (lamparaEncendida) {
            btn.classList.add("encendido");
            btn.innerHTML = '<i class="fa-solid fa-lightbulb-slash"></i> Apagar Lámpara';
            reproducirVoz("Lámpara encendida.");
          } else {
            btn.classList.remove("encendido");
            btn.innerHTML = '<i class="fa-solid fa-lightbulb"></i> Encender Lámpara';
            reproducirVoz("Lámpara apagada.");
          }
        }).catch(e => {
          reproducirVoz("Hardware ocupado.");
        });
      } catch (err) { 
        reproducirVoz("Función de linterna no compatible."); 
      }
    }

    function clickAuditivoInput() {
      const cant = document.getElementById("cant-multiplicador").value;
      if(cant > 1) {
        reproducirVoz("Cantidad multiplicada por " + cant);
      }
    }

    function iniciarTemporizadorLimpiezaAutomatica() {
      setTimeout(() => {
        document.getElementById("txt-prod").innerText = "Buscando códigos...";
        document.getElementById("txt-monto").innerText = "---";
        document.getElementById("txt-cod").innerText = "Muestre la barra al lente trasero";
      }, 6000);
    }

    function solicitarTasaCambioAutomaticaAlInicio() {
      if (!navigator.onLine) return;
      fetch(URL_APPS_SCRIPT, {
        method: "POST",
        headers: { "Content-Type": "text/plain" },
        body: JSON.stringify({ accion: "obtenerTasaSoloLectura" })
      })
      .then(res => res.json())
      .then(data => {
        if (data.tasa && parseFloat(data.tasa) > 0) {
          window.tasaCambioSistema = parseFloat(data.tasa);
          localStorage.setItem("tasaEmergenciaGuardada", data.tasa.toString());
        }
      }).catch(e => {});
    }

    function forzarTasaManualEmergencia() {
      reproducirVoz("Abriendo panel de tasa de cambio de emergencia.");
      const tasaIngresada = prompt("MODO EMERGENCIA: Ingrese el precio del dólar en Bolívares:", window.tasaCambioSistema);
      const valorLimpio = parseFloat(tasaIngresada);
      
      if (valorLimpio && valorLimpio > 0) {
        window.tasaCambioSistema = valorLimpio;
        localStorage.setItem("tasaEmergenciaGuardada", valorLimpio.toString());
        reproducirVoz("Tasa fijada exitosamente a " + valorLimpio + " bolívares.");
        alert(`Memoria actualizada: 1 $ = ${valorLimpio} Bs`);
      } else {
        reproducirVoz("Acción cancelada.");
      }
    }

    function dispararTransmisionUrl(codigo) {
      const cantidad = parseInt(document.getElementById("cant-multiplicador").value) || 1;
      document.getElementById("txt-prod").innerText = "Transmitiendo datos...";
      document.getElementById("txt-monto").innerText = "---";
      document.getElementById("txt-cod").innerText = `Código: ${codigo}`;

      if (!navigator.onLine) {
        reproducirVoz("Error de red. Producto no verificado en la nube.");
        document.getElementById("txt-prod").innerText = "Modo fuera de línea";
        abrirFormularioRegistroRapido(codigo);
        return;
      }

      fetch(URL_APPS_SCRIPT, {
        method: "POST",
        headers: { "Content-Type": "text/plain" },
        body: JSON.stringify({ accion: "registrarEscaneoDesdeCelular", codigo: codigo, cantidad: cantidad })
      })
      .then(response => response.json())
      .then(data => {
        if (data.tasa && parseFloat(data.tasa) > 0) {
          window.tasaCambioSistema = parseFloat(data.tasa);
          localStorage.setItem("tasaEmergenciaGuardada", data.tasa.toString());
        }

        if (data.status === "MANTENIMIENTO") {
          reproducirVoz("Servidor bloqueado por mantenimiento.");
          document.body.innerHTML = "<h1 style='color:white;text-align:center;margin-top:50px;'>MANTENIMIENTO</h1>";
        } else if (data.status === "transmitido") {
          document.getElementById("txt-prod").innerText = data.nombre;
          document.getElementById("txt-monto").innerText = `$${parseFloat(data.precio * cantidad).toFixed(2)}`;
          document.getElementById("txt-cod").innerText = `Código: ${codigo} (x${cantidad})`;
          document.getElementById("cant-multiplicador").value = "1";
          reproducirVoz("Artículo " + data.nombre + " transmitido con éxito.");
          iniciarTemporizadorLimpiezaAutomatica();
        } else if (data.status === "solicitar_registro") {
          reproducirVoz("Atención: Producto no registrado en el inventario.");
          abrirFormularioRegistroRapido(codigo);
        }
      })
      .catch(e => { 
        document.getElementById("txt-prod").innerText = "Error de Transmisión";
        reproducirVoz("Falla crítica en la respuesta del servidor.");
      });
    }

    function abrirFormularioRegistroRapido(codigo) {
      document.getElementById("reg-codigo").value = codigo;
      document.getElementById("reg-nombre").value = "";
      document.getElementById("reg-precio-usd").value = "";
      document.getElementById("reg-precio-bs").value = "";
      document.getElementById("modal-registro-rapido").style.display = "flex";
    }

    document.getElementById("reg-precio-usd").addEventListener("input", function() {
      const usd = parseFloat(this.value);
      if (!isNaN(usd) && usd > 0) {
        document.getElementById("reg-precio-bs").value = (usd * window.tasaCambioSistema).toFixed(2);
      } else { document.getElementById("reg-precio-bs").value = ""; }
    });

    document.getElementById("reg-precio-bs").addEventListener("input", function() {
      const bs = parseFloat(this.value);
      if (!isNaN(bs) && bs > 0) {
        document.getElementById("reg-precio-usd").value = (bs / window.tasaCambioSistema).toFixed(2);
      } else { document.getElementById("reg-precio-usd").value = ""; }
    });

    function ejecutarGuardadoAutomaticoBodega() {
      const codigo = document.getElementById("reg-codigo").value;
      const nombre = document.getElementById("reg-nombre").value.trim();
      let precioUsdFinal = parseFloat(document.getElementById("reg-precio-usd").value) || 0;
      let precioBsFinal = parseFloat(document.getElementById("reg-precio-bs").value) || 0;
      const cantidad = parseInt(document.getElementById("cant-multiplicador").value) || 1;
      const tasaActual = window.tasaCambioSistema;

      if (nombre === "" || (precioUsdFinal <= 0 && precioBsFinal <= 0)) {
        reproducirVoz("Formulario incompleto. Verifique los campos.");
        alert("Por favor ingrese un nombre y un precio correcto.");
        return;
      }

      if (precioUsdFinal <= 0 && precioBsFinal > 0) {
        precioUsdFinal = parseFloat((precioBsFinal / tasaActual).toFixed(2));
      }
      if (precioBsFinal <= 0 && precioUsdFinal > 0) {
        precioBsFinal = parseFloat((precioUsdFinal * tasaActual).toFixed(2));
      }

      document.getElementById("modal-registro-rapido").style.display = "none";
      document.getElementById("txt-prod").innerText = "Guardando artículo...";

      if (!navigator.onLine) {
        reproducirVoz("Sin internet. Guardado local de emergencia activo.");
        bloqueoUnMilisegundo = false;
        return;
      }

      // Solución unificada: Enviamos tanto "accion" como "accionAlternativa" con la tasa para no fallar en Google Drive
      const paqueteEnvio = {
        accion: "guardarNuevoProducto", 
        accionAlternativa: "guardarProductoNuevoYVender",
        codigo: codigo,
        nombre: nombre,
        precio: precioUsdFinal,
        precioUsd: precioUsdFinal,
        precioBs: precioBsFinal,
        tasa: tasaActual,
        cantidad: cantidad
      };

      fetch(URL_APPS_SCRIPT, {
        method: "POST",
        headers: { "Content-Type": "text/plain" },
        body: JSON.stringify(paqueteEnvio)
      })
      .then(res => res.json())
      .then(data => {
        if (data.status === "guardado_y_transmitido" || data.status === "creado_y_transmitido" || data.status === "transmitido") {
          document.getElementById("txt-prod").innerText = nombre;
          document.getElementById("txt-monto").innerText = `$${parseFloat(precioUsdFinal * cantidad).toFixed(2)}`;
          document.getElementById("txt-cod").innerText = `Código: ${codigo} (x${cantidad})`;
          document.getElementById("cant-multiplicador").value = "1";
          reproducirVoz("Producto inventariado y vendido con éxito.");
          bloqueoUnMilisegundo = false;
          iniciarTemporizadorLimpiezaAutomatica();
        } else {
          throw new Error("Respuesta de servidor inválida");
        }
      })
      .catch(e => {
        reproducirVoz("Error al subir a la nube.");
        document.getElementById("txt-prod").innerText = "Error de Guardado";
        bloqueoUnMilisegundo = false;
      });
    }

    function cerrarFormularioRegistro() {
      reproducirVoz("Formulario cerrado.");
      document.getElementById("modal-registro-rapido").style.display = "none";
      document.getElementById("txt-prod").innerText = "Buscando códigos...";
      bloqueoUnMilisegundo = false;
    }

    function forzarReinicioLenteNativo() {
      reproducirVoz("Reiniciando y limpiando lente óptico.");
      
      document.getElementById("txt-prod").innerText = "Buscando códigos...";
      document.getElementById("txt-monto").innerText = "---";
      document.getElementById("txt-cod").innerText = "Muestre la barra al lente trasero";
      document.getElementById("cant-multiplicador").value = "1";

      if (bucleEscaneoActivo) clearInterval(bucleEscaneoActivo);
      
      if (streamVideoActivo && streamVideoActivo.getTracks) {
        streamVideoActivo.getTracks().forEach(track => {
          track.stop();
        });
      }
      
      pistaVideoLente = null;
      lamparaEncendida = false;
      encenderCamaraInternaPura();
    }

    function ingresoCodigoManual() {
      reproducirVoz("Abriendo entrada de código de barras manual.");
      const cod = prompt("Ingrese el código de barras manualmente:");
      if (cod && cod.trim() !== "") {
        dispararTransmisionUrl(cod.trim());
      } else {
        reproducirVoz("Acción manual cancelada.");
      }
    }

    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("./sw.js").catch((error) => {});
      });
    }
  
  </script>
</body>
</html>
